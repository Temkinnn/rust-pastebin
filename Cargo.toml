[package]
name = "rust-pastebin"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.14.0"
chrono = "0.4.45"
dotenvy = "0.15.7"
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono"] }
thiserror = "2.0.19"
utoipa = { version = "5.5.0", features = ["actix_extras"] }
utoipa-actix-web = "0.1.2"
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }
uuid = {version = "1.24.0", features = ["v7"]}
